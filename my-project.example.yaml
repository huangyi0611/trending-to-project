name: 邻里换书角
summary: |
  一个微信小程序，让同一个小区的邻居互相借书、换书。
  按楼栋显示附近有哪些书，借出和归还都在小程序里点一下。
stack:
  - 微信小程序
  - 云开发数据库
goals: |
  想让 AI 帮我补测试，少一点上线前手动点一遍；
  另外想给借书流程写一份清楚的规则说明。
